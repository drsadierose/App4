<!DOCTYPE html> 
<html> 
   <head> 
      <title>Asthma vs. VCD Checker</title>  
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="apple-mobile-web-app-capable" content="yes">
      <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
      <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-colors-flat.css">
      <style>
         img, object {
            max-height: 90%;
            max-width: 90%;
         }
         .image-container {
            text-align: center;
            margin-top: 10px;
         }
      </style>
      <script>
        let asthma_count = 0;
        let vcd_count = 0; 
        let currentQuestion = 0;

        const questions = [
            { text: "Do you experience wheezing or chest tightness, especially at night or early in the morning?", asthma: true },
            { text: "Do you have difficulty breathing in (inspiration) rather than out (expiration) during an attack?", asthma: false },
            { text: "Does your breathing trouble improve significantly with the use of an inhaler (such as albuterol)?", asthma: true },
            { text: "Do your symptoms worsen with exercise but improve with rest?", asthma: false },
            { text: "Have you been diagnosed with allergies, eczema, or a history of childhood asthma?", asthma: true },
            { text: "Do you experience throat tightness or hoarseness during an episode?", asthma: false }
        ];

        function nextQuestion(isAsthma) {
            if (isAsthma) {
                asthma_count++;
            } else {
                vcd_count++;
            }
            
            currentQuestion++;
            
            if (currentQuestion < questions.length) {
                document.getElementById("question-text").innerText = questions[currentQuestion].text;
            } else {
                showResults();
            }
        }

        function showResults() {
            const total = asthma_count + vcd_count;
            const asthmaPercentage = total ? Math.round((asthma_count / total) * 100) : 50;
            const vcdPercentage = 100 - asthmaPercentage;

            document.getElementById("quiz-container").style.display = "none";
            document.getElementById("result-container").style.display = "block";
            document.getElementById("result-text").innerText = 
                `Asthma Probability: ${asthmaPercentage}%\nVocal Cord Dysfunction Probability: ${vcdPercentage}%`;
        }
      </script>
   </head> 
   <body> 
      <header class="w3-container w3-flat-carrot">
        <h1>Asthma vs. VCD Checker</h1>
      </header>

      <div id="quiz-container" class="w3-container">
          <p id="question-text">Do you experience wheezing or chest tightness, especially at night or early in the morning?</p> 
          <div class="image-container">
              <img id="question-image" src="https://uph-p-001-delivery.sitecorecontenthub.cloud/api/public/content/4a98179fa9d44b5991d616cd3857819a?v=de4a8f28&t=1440xnull.jpg" alt="Symptom Image">
          </div>
          <button onclick="nextQuestion(true);" class="w3-btn w3-black">Yes</button>
          <button onclick="nextQuestion(false);" class="w3-btn w3-black">No</button>
      </div>

      <div id="result-container" class="w3-container" style="display: none;">
          <h2>Diagnosis</h2>
          <p id="result-text"></p>
      </div>
      <div class="image-container">
    <img id="question-image" src="https://uph-p-001-delivery.sitecorecontenthub.cloud/api/public/content/4a98179fa9d44b5991d616cd3857819a?v=de4a8f28&t=1440xnull" alt="Symptom Image" onerror="this.onerror=null; this.src='https://via.placeholder.com/300';">
</div>


      <footer class="w3-bottom w3-container w3-flat-carrot">
        <p>By Sadie Ostrowicki!</p>
      </footer>
   </body>
</html>
